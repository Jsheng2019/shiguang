name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backend:
    name: Backend — TypeScript
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: backend/dist/
          retention-days: 7

  frontend:
    name: Frontend — TypeScript + Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Expo web export
        run: npx expo export --platform web
      - name: Fix absolute paths for GitHub Pages
        run: |
          sed -i 's|src="/_expo/|src="./_expo/|g; s|href="/_expo/|href="./_expo/|g' dist/index.html
          sed -i 's|<html lang="en">|<html lang="zh-CN">|' dist/index.html
          sed -i 's|<title>拾光</title>|<title>拾光 - 免费影视</title>|' dist/index.html
          sed -i 's|<div id="root"></div>|<div id="root"><div style="display:flex;align-items:center;justify-content:center;height:100vh;background:#0f0f0f;color:#a0a0a0;font-family:sans-serif;font-size:16px">拾光 · 加载中...</div></div>|' dist/index.html
          sed -i 's|body {|body { background: #0f0f0f; |' dist/index.html
      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: app/dist/
          retention-days: 7

  deploy-web:
    name: Deploy Web to GitHub Pages
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          force_orphan: true

  pm-e2e-test:
    name: PM — Playwright E2E Test
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: deploy-web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: npm install playwright
      - name: Install Chromium
        run: npx playwright install chromium --with-deps
      - name: Wait for deployments
        run: sleep 20
      - name: Run E2E test
        run: node tests/pm-smoke-test.mjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pm-screenshots
          path: /tmp/pm-screenshot-*.png
          retention-days: 3
