name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backend:
    name: Backend — TypeScript
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: backend/dist/
          retention-days: 7

  frontend:
    name: Frontend — TypeScript + Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Expo web export
        run: npx expo export --platform web
      - name: Fix absolute paths for GitHub Pages
        run: |
          sed -i 's|src="/_expo/|src="./_expo/|g; s|href="/_expo/|href="./_expo/|g' dist/index.html
          sed -i 's|<html lang="en">|<html lang="zh-CN">|' dist/index.html
          sed -i 's|<title>拾光</title>|<title>拾光 - 免费影视</title>|' dist/index.html
          sed -i 's|<div id="root"></div>|<div id="root"><div style="display:flex;align-items:center;justify-content:center;height:100vh;background:#0f0f0f;color:#a0a0a0;font-family:sans-serif;font-size:16px">拾光 · 加载中...</div></div>|' dist/index.html
          sed -i 's|body {|body { background: #0f0f0f; |' dist/index.html
      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: app/dist/
          retention-days: 7

  deploy-web:
    name: Deploy Web to GitHub Pages
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          force_orphan: true

  smoke-test:
    name: PM — Smoke Test
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: deploy-web
    runs-on: ubuntu-latest
    steps:
      - name: Wait for GitHub Pages cache
        run: sleep 15
      - name: Check page loads
        run: |
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" "https://jsheng2019.github.io/shiguang/")
          if [ "$HTTP" != "200" ]; then
            echo "FAIL: Page returned HTTP $HTTP"
            exit 1
          fi
          echo "PASS: Page loads (HTTP 200)"
      - name: Check JS bundle loads
        run: |
          HTML=$(curl -s "https://jsheng2019.github.io/shiguang/")
          JS_FILE=$(echo "$HTML" | grep -oP 'src="\./_expo/static/js/web/[^"]+\.js"' | head -1 | sed 's/src="//;s/"//')
          if [ -z "$JS_FILE" ]; then
            echo "FAIL: No JS bundle found in HTML"
            exit 1
          fi
          JS_URL="https://jsheng2019.github.io/shiguang/${JS_FILE#./}"
          JS_HTTP=$(curl -s -o /dev/null -w "%{http_code}" "$JS_URL")
          if [ "$JS_HTTP" != "200" ]; then
            echo "FAIL: JS bundle returned HTTP $JS_HTTP"
            exit 1
          fi
          echo "PASS: JS bundle loads ($JS_FILE)"
      - name: Check demo content
        run: |
          HTML=$(curl -s "https://jsheng2019.github.io/shiguang/")
          JS_FILE=$(echo "$HTML" | grep -oP 'src="\./_expo/static/js/web/[^"]+\.js"' | head -1 | sed 's/src="//;s/"//')
          JS_URL="https://jsheng2019.github.io/shiguang/${JS_FILE#./}"
          # Check demo data is in JS bundle (Unicode escape for 大闹天宫)
          if curl -s "$JS_URL" | grep -q '\\\\u5927\\\\u95f9\\\\u5929\\\\u5bab'; then
            echo "PASS: Demo content present in JS bundle"
          else
            echo "FAIL: Demo content missing from JS bundle"
            exit 1
          fi
      - name: Check basic accessibility
        run: |
          HTML=$(curl -s "https://jsheng2019.github.io/shiguang/")
          CHECKS=(
            "<title>拾光 - 免费影视</title>"
            'id="root"'
            "<noscript>"
            "background: #0f0f0f"
          )
          for check in "${CHECKS[@]}"; do
            if echo "$HTML" | grep -qF "$check"; then
              echo "PASS: Found '$check'"
            else
              echo "FAIL: Missing '$check'"
              exit 1
            fi
          done
          echo "--- All accessibility checks passed ---"
